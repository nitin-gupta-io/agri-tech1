<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AgriTech AI Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🌱 AgriTech AI Prediction</h1>
  <form id="predictForm">
    <label>Crop Name:</label>
    <input type="text" id="crop" required><br><br>
    <label>Soil Moisture (%):</label>
    <input type="number" id="soilMoisture" required><br><br>
    <label>Temperature (°C):</label>
    <input type="number" id="temperature" required><br><br>
    <button type="submit">Predict Yield</button>
  </form>
  <div id="resultBox">
    <h2>Prediction Result:</h2>
    <p id="prediction"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
